<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Ahmed Khaled · Interview Prep</title>
    <script>
      // Apply saved theme/language before first paint to avoid a flash.
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem('ip.theme') || '"light"');
          var lang = JSON.parse(localStorage.getItem('ip.lang') || '"en"');
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.lang = lang === 'ar' ? 'ar' : 'en';
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
